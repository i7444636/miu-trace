name: Sync public Google Sheets beta
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build beta index
        run: python scripts/sync_google_beta.py
      - name: Commit changed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/beta-events.json
          git diff --cached --quiet || git commit -m "Sync public Google Sheets beta index"
          git push

